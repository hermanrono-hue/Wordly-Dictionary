<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Single Page Application</title>   
</head>
<body>
    <header>
        <h1>Wordly Dictionary</h1>
    </header>

    <main>
        <form id="search-form" aria-label="Search for a word">
            <input type="text" id="search-input" placeholder="Enter a word" required>
            <br><br>
            <button type="submit">Search</button>
        </form>

        <section id="results">
            <!-- definitions, pronunciations, synonyms -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
